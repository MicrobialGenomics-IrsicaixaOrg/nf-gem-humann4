# Independent pipeline: institution-specific CI and no reference-genome or full-cohort test profile.
repository_type: pipeline
nf_core_version: 3.5.1
lint:
  files_unchanged:
  - CODE_OF_CONDUCT.md
  - assets/nf-core-nf-gem-humann4_logo_light.png
  - docs/images/nf-core-nf-gem-humann4_logo_light.png
  - docs/images/nf-core-nf-gem-humann4_logo_dark.png
  - .github/ISSUE_TEMPLATE/bug_report.yml
  - .github/CONTRIBUTING.md
  - .github/PULL_REQUEST_TEMPLATE.md
  - assets/email_template.txt
  - docs/README.md
  nextflow_config:
  - manifest.name
  - manifest.homePage
  - custom_config
  multiqc_config:
  - report_comment
  files_exist:
  - CODE_OF_CONDUCT.md
  - assets/nf-core-nf-gem-humann4_logo_light.png
  - docs/images/nf-core-nf-gem-humann4_logo_light.png
  - docs/images/nf-core-nf-gem-humann4_logo_dark.png
  - .github/ISSUE_TEMPLATE/config.yml
  - .github/workflows/awstest.yml
  - .github/workflows/awsfulltest.yml
  - .github/workflows/branch.yml
  - .github/workflows/nf-test.yml
  - .github/workflows/linting_comment.yml
  - .github/workflows/linting.yml
  - conf/test_full.config
  - conf/igenomes.config
  - conf/igenomes_ignored.config
  nf_test_content:
  - tests/nextflow.config
template:
  org: MicrobialGenomics-IrsicaixaOrg
  name: humann4
  description: HUMAnN 4 functional profiling from cleaned reads and existing MetaPhlAn
    profiles
  author: MicrobialGenomics-IrsicaixaOrg
  version: 0.1.0dev
  force: true
  is_nfcore: false
